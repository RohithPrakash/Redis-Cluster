# SPDX-License-Identifier: Apache-2.0
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis-cluster.fullname" . }}-scripts
  labels:
    {{- include "redis-cluster.labels" . | nindent 4 }}
data:
  bootstrap.sh: |
    #!/bin/sh
    set -e

    REPLICAS={{ .Values.redisCluster.replicas }}
    SERVICE={{ include "redis-cluster.fullname" . }}
    NAMESPACE={{ .Release.Namespace }}
    CLUSTER_DOMAIN={{ .Values.clusterDomain }}
{{- if .Values.auth.enabled }}
    REDIS_PASSWORD="{{ .Values.auth.password }}"
{{- end }}
    REDISCLI="{{ include "redis-cluster.redisCli" . }}"

    if [ "$((REPLICAS % 2))" -ne 0 ]; then
      echo "ERROR: redisCluster.replicas must be an even number (n/2 masters, n/2 replicas)."
      exit 1
    fi
    NUM_MASTERS=$((REPLICAS / 2))

    POD_NAME=$(hostname)
    if [ "${BOOTSTRAP_ROLE}" = "init" ] && [ "$POD_NAME" != "${SERVICE}-0" ]; then
      exit 0
    fi

    if [ "$POD_NAME" = "${SERVICE}-0" ]; then
      MODE="init"
      TARGET_HOST="127.0.0.1"

      cp /etc/redis/redis.conf /data/redis.conf
      redis-server /data/redis.conf &
      REDIS_PID=$!

      cleanup() {
        kill $REDIS_PID 2>/dev/null || true
        wait $REDIS_PID 2>/dev/null || true
      }
      trap cleanup EXIT

      sleep 2

      if $REDISCLI -h "$TARGET_HOST" -p 6379 cluster info 2>/dev/null | grep -q "cluster_state:ok"; then
        echo "Cluster already initialized."
        exit 0
      fi

      KNOWN_NODES=$($REDISCLI -h "$TARGET_HOST" -p 6379 cluster info 2>/dev/null | awk -F: '/cluster_known_nodes:/{print $2}' | tr -d '[:space:]')
      if [ -n "$KNOWN_NODES" ] && [ "$KNOWN_NODES" -gt 1 ] 2>/dev/null; then
        echo "Node already knows $KNOWN_NODES cluster nodes. Skipping creation."
        exit 0
      fi
    else
      MODE="job"
      TARGET_HOST="${SERVICE}-0.${SERVICE}.${NAMESPACE}.svc.${CLUSTER_DOMAIN}.local"

      if $REDISCLI -h "$TARGET_HOST" -p 6379 cluster info 2>/dev/null | grep -q "cluster_state:ok"; then
        echo "Cluster already initialized."
        exit 0
      fi
    fi

    for i in $(seq 0 $((REPLICAS - 1))); do
      HOST="${SERVICE}-${i}.${SERVICE}.${NAMESPACE}.svc.${CLUSTER_DOMAIN}.local"
      echo "Waiting for $HOST to respond to PING..."
      until $REDISCLI -h "$HOST" -p 6379 ping | grep -q PONG; do
        sleep 2
      done
    done

    echo "Joining nodes to the cluster..."
    for i in $(seq 1 $((REPLICAS - 1))); do
      HOST="${SERVICE}-${i}.${SERVICE}.${NAMESPACE}.svc.${CLUSTER_DOMAIN}.local"
      IP=$(getent hosts "$HOST" | awk '{print $1}')
      $REDISCLI -h "$TARGET_HOST" -p 6379 CLUSTER MEET "$IP" 6379
    done

    echo "Waiting for all nodes to be known..."
    until [ "$($REDISCLI -h "$TARGET_HOST" -p 6379 cluster info | awk -F: '/cluster_known_nodes:/{print $2}' | tr -d '[:space:]')" = "$REPLICAS" ]; do
      sleep 2
    done

    echo "Assigning hash slots across $NUM_MASTERS masters..."
    TOTAL_SLOTS=16384
    for i in $(seq 0 $((NUM_MASTERS - 1))); do
      START=$((i * TOTAL_SLOTS / NUM_MASTERS))
      END=$(((i + 1) * TOTAL_SLOTS / NUM_MASTERS - 1))
      MASTER_HOST="${SERVICE}-${i}.${SERVICE}.${NAMESPACE}.svc.${CLUSTER_DOMAIN}.local"
      echo "Master $i: slots $START-$END"
      $REDISCLI -h "$MASTER_HOST" -p 6379 CLUSTER ADDSLOTS $(seq "$START" "$END")
    done

    echo "Waiting for slot assignment to propagate..."
    until [ "$($REDISCLI -h "$TARGET_HOST" -p 6379 cluster info | awk -F: '/cluster_slots_assigned:/{print $2}' | tr -d '[:space:]')" = "16384" ]; do
      sleep 2
    done

    echo "Configuring replicas..."
    for i in $(seq 0 $((NUM_MASTERS - 1))); do
      REPLICA_INDEX=$((NUM_MASTERS + i))
      MASTER_HOST="${SERVICE}-${i}.${SERVICE}.${NAMESPACE}.svc.${CLUSTER_DOMAIN}.local"
      REPLICA_HOST="${SERVICE}-${REPLICA_INDEX}.${SERVICE}.${NAMESPACE}.svc.${CLUSTER_DOMAIN}.local"
      MASTER_ID=$($REDISCLI -h "$MASTER_HOST" -p 6379 CLUSTER MYID)
      echo "Replica $REPLICA_INDEX -> Master $i ($MASTER_ID)"
      $REDISCLI -h "$REPLICA_HOST" -p 6379 CLUSTER REPLICATE "$MASTER_ID"
    done

    if [ "$MODE" = "init" ]; then
      echo "Redis Cluster created successfully."
    else
      echo "Redis Cluster created successfully via Job."
    fi
  start.sh: |
    #!/bin/sh
    set -e

    REPLICAS={{ .Values.redisCluster.replicas }}
    SERVICE={{ include "redis-cluster.fullname" . }}
    NAMESPACE={{ .Release.Namespace }}
    CLUSTER_DOMAIN={{ .Values.clusterDomain }}
    REDISCLI="{{ include "redis-cluster.redisCli" . }}"
    POD_NAME=$(hostname)

    cp /etc/redis/redis.conf /data/redis.conf
    echo "cluster-announce-ip ${POD_IP}" >> /data/redis.conf
    echo "cluster-announce-hostname ${POD_NAME}.${SERVICE}" >> /data/redis.conf

    # The cluster bus only connects to peers by IP, and nodes.conf records the
    # IPs peers had when it was last written. When all pods are recreated
    # (e.g. scaled to 0 and back) every recorded IP is stale and no node can
    # reach any other. Re-introduce each peer by its current IP; the MEET
    # handshake matches the existing node ID and updates its address.
    rejoin_cluster() {
      until $REDISCLI -h 127.0.0.1 -p 6379 ping 2>/dev/null | grep -q PONG; do
        sleep 1
      done

      PENDING=""
      for i in $(seq 0 $((REPLICAS - 1))); do
        [ "${SERVICE}-${i}" = "$POD_NAME" ] || PENDING="$PENDING $i"
      done

      while [ -n "$PENDING" ]; do
        REMAINING=""
        for i in $PENDING; do
          HOST="${SERVICE}-${i}.${SERVICE}.${NAMESPACE}.svc.${CLUSTER_DOMAIN}.local"
          IP=$(getent hosts "$HOST" | awk '{print $1; exit}')
          if [ -n "$IP" ] && $REDISCLI -h "$HOST" -p 6379 ping 2>/dev/null | grep -q PONG; then
            echo "Rejoining $HOST at $IP"
            $REDISCLI -h 127.0.0.1 -p 6379 CLUSTER MEET "$IP" 6379 >/dev/null
          else
            REMAINING="$REMAINING $i"
          fi
        done
        PENDING=$REMAINING
        [ -z "$PENDING" ] || sleep 2
      done
    }

    # Only rejoin if this node already belonged to a cluster. On a fresh
    # install, creation is left to the bootstrap so the two don't race.
    if [ -f /data/nodes.conf ] && [ "$(grep -cv '^vars' /data/nodes.conf)" -gt 1 ]; then
      rejoin_cluster &
    fi

    exec redis-server /data/redis.conf
