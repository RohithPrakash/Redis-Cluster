# SPDX-License-Identifier: Apache-2.0
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "redis-cluster.fullname" . }}
  labels:
    {{- include "redis-cluster.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "redis-cluster.fullname" . }}
  replicas: {{ .Values.redisCluster.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "redis-cluster.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "redis-cluster.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "redis-cluster.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if not .Values.bootstrapJob.enabled }}
      initContainers:
        - name: cluster-bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "/scripts/bootstrap.sh"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: BOOTSTRAP_ROLE
              value: "init"
            {{- if .Values.auth.enabled }}
            {{- include "redis-cluster.authEnv" . | trim | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis
              readOnly: true
            - name: redis-scripts
              mountPath: /scripts
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
{{- if .Values.tls.enabled }}
            - name: redis-tls
              mountPath: /etc/redis/tls
              readOnly: true
{{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- end }}
      containers:
        - name: redis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- if .Values.auth.enabled }}
            {{- include "redis-cluster.authEnv" . | trim | nindent 12 }}
            {{- end }}
          command: ["/bin/sh", "/scripts/start.sh"]
          ports:
            - name: redis-client
              containerPort: 6379
              protocol: TCP
            - name: cluster-bus
              containerPort: 16379
              protocol: TCP
          # Liveness uses the plaintext Unix socket so it does not depend on
          # the TLS certificate being valid, and fails on any reply other than
          # PONG (e.g. BUSY from a stuck script). LOADING is still alive.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  OUT=$(redis-cli -s /tmp/redis.sock ping 2>&1)
                  case "$OUT" in PONG|LOADING*|MASTERDOWN*) exit 0 ;; esac
                  echo "$OUT"; exit 1
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  {{ include "redis-cluster.redisCli" . }} -h 127.0.0.1 -p 6379 cluster info | grep -q "cluster_state:ok"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: redis-config
              mountPath: /etc/redis
              readOnly: true
            - name: redis-scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
{{- if .Values.tls.enabled }}
            - name: redis-tls
              mountPath: /etc/redis/tls
              readOnly: true
{{- end }}
          # Hand a master's slots to a replica before shutdown, so planned
          # restarts and drains do not wait for a failover election.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "/scripts/prestop.sh"]
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if kindIs "map" .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - {{ include "redis-cluster.name" . }}
                  - key: app.kubernetes.io/instance
                    operator: In
                    values:
                      - {{ .Release.Name }}
              topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - {{ include "redis-cluster.name" . }}
                    - key: app.kubernetes.io/instance
                      operator: In
                      values:
                        - {{ .Release.Name }}
                topologyKey: topology.kubernetes.io/zone
        {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: redis-config
          configMap:
            name: {{ include "redis-cluster.fullname" . }}-config
        - name: redis-scripts
          configMap:
            name: {{ include "redis-cluster.fullname" . }}-scripts
        - name: tmp
          emptyDir: {}
{{- if .Values.tls.enabled }}
        - name: redis-tls
          secret:
            secretName: {{ include "redis-cluster.tlsSecretName" . }}
{{- end }}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "redis-cluster.labels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
