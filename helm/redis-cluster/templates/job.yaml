# SPDX-License-Identifier: Apache-2.0
{{- if .Values.bootstrapJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "redis-cluster.fullname" . }}-bootstrap
  labels:
    {{- include "redis-cluster.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      # Not the Redis pods' selector labels, for the same reasons as the
      # helm test pod: Service, PDB and anti-affinity.
      labels:
        helm.sh/chart: {{ include "redis-cluster.chart" . }}
        app.kubernetes.io/name: {{ include "redis-cluster.name" . }}-bootstrap
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "redis-cluster.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "/scripts/bootstrap.sh"]
          env:
            - name: BOOTSTRAP_ROLE
              value: "job"
            {{- if .Values.auth.enabled }}
            {{- include "redis-cluster.authEnv" . | trim | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: redis-scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
{{- if .Values.tls.enabled }}
            - name: redis-tls
              mountPath: /etc/redis/tls
              readOnly: true
{{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: redis-scripts
          configMap:
            name: {{ include "redis-cluster.fullname" . }}-scripts
        - name: tmp
          emptyDir: {}
{{- if .Values.tls.enabled }}
        - name: redis-tls
          secret:
            secretName: {{ include "redis-cluster.tlsSecretName" . }}
{{- end }}
{{- end }}
