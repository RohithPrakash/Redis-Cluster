# SPDX-License-Identifier: Apache-2.0
{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "redis-cluster.authSecretName" . }}
  labels:
    {{- include "redis-cluster.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ required "auth.password or auth.existingSecret is required when auth.enabled is true" .Values.auth.password | b64enc | quote }}
{{- end }}
