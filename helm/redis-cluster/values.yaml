# SPDX-License-Identifier: Apache-2.0
#
# Default values for redis-cluster.
# This is a YAML-formatted file.

redisCluster:
  # Total number of nodes in the cluster (must be even and >= 6 for --cluster-replicas 1)
  replicas: 6

image:
  repository: redis-cluster
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Kubernetes cluster domain suffix. The default is "cluster" which produces
# .svc.cluster.local DNS names. Change this if your cluster uses a custom domain.
clusterDomain: cluster

serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  # The Redis pods do not need to call the Kubernetes API.
  automount: false
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsUser: 999
  runAsGroup: 999
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

persistence:
  enabled: true
  # Must be at least 3x redisConfig.maxmemory: the RDB snapshot, the AOF base,
  # the AOF increments and the new base written during a rewrite all share
  # this volume. When it fills, Redis rejects every write (even DEL) and cannot
  # recover by itself. See README "Disk sizing".
  size: 512Mi
  storageClass: standard
  # Fail the install/upgrade when size is below 3x redisConfig.maxmemory.
  # Only disable this for existing releases whose PVCs cannot be resized yet.
  validateSize: true

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Affinity rules for pod scheduling. If left empty or not set, default anti-affinity rules
# (required on hostname, preferred on zone) will be applied.
# Set to {} to disable default anti-affinity (e.g., for single-node clusters).
affinity:

nodeSelector: {}

tolerations: []

podDisruptionBudget:
  enabled: true

networkPolicy:
  enabled: true
  egress:
    enabled: true

# Redis authentication.
# When enabled, all redis-cli calls (probes, bootstrap, tests) automatically
# include the password. Set requirepass and masterauth in redis.conf.
auth:
  enabled: false
  password: ""
  # Name of an existing Secret containing the Redis password.
  existingSecret: ""
  existingSecretPasswordKey: "password"

# Redis configuration directives.
redisConfig:
  maxmemory: "96mb"
  # What Redis does when maxmemory is reached.
  # - noeviction: reject writes with an OOM error; no stored key is ever dropped.
  # - allkeys-lru / allkeys-lfu / volatile-* / allkeys-random: evict keys to
  #   make room. This turns the cluster into a cache: acknowledged writes are
  #   silently deleted and clients see no error. Only use it for cache data.
  maxmemoryPolicy: noeviction
  # A master rejects writes (NOREPLICAS) unless at least this many replicas
  # acknowledged replication within minReplicasMaxLag seconds. This bounds how
  # long a master cut off from the cluster keeps accepting writes that will be
  # lost on failover. 0 disables the check; the maximum is 1 (one replica per
  # master). With 1, a shard also rejects writes while its replica is down or
  # restarting. See README "Write safety".
  minReplicasToWrite: 1
  minReplicasMaxLag: 10
  # Milliseconds a node may be unreachable before it is considered failed.
  # Lower values fail over faster but react to short network blips.
  clusterNodeTimeout: 15000

# TLS configuration for encrypted client connections.
# The AlmaLinux 9 Redis package is compiled with OpenSSL TLS support.
tls:
  enabled: false
  # Encrypt the cluster bus (port 16379) in addition to client connections.
  # This is an advanced setting — your certificates must include SANs that match
  # all pod hostnames, otherwise inter-node handshake will fail.
  clusterBus: false
  # Name of an existing Secret containing the certificate files.
  # If empty and certManager is disabled, TLS will not be mounted.
  existingSecret: ""
  certFilename: tls.crt
  keyFilename: tls.key
  caFilename: ca.crt
  # Client certificate authentication mode.
  # - "no"        : client certificates are not required
  # - "optional"  : client certificates are optional; if presented, they are validated
  # - "yes"       : client certificates are mandatory for all TLS connections
  authClients: "no"
  # TLS session caching reduces handshake overhead for reconnecting clients.
  sessionCaching:
    enabled: true
    size: 20480
    timeout: 300
  # Auto-generate certificates using cert-manager.
  certManager:
    enabled: false
    # issuerRef passed to the Certificate resource.
    issuerRef: {}
      # name: "my-issuer"
      # kind: "ClusterIssuer"

# Alternative bootstrap method using a Kubernetes Job.
# Enable this if you prefer Job-based cluster creation over the initContainer approach.
bootstrapJob:
  enabled: false
