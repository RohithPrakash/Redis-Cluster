# Default values for redis-cluster.
# This is a YAML-formatted file.

redisCluster:
  # Total number of nodes in the cluster (must be even and >= 6 for --cluster-replicas 1)
  replicas: 6

image:
  repository: redis-cluster
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999

securityContext:
  runAsUser: 999
  runAsGroup: 999
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

persistence:
  enabled: true
  size: 100Mi
  storageClass: standard

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Affinity rules for pod scheduling. If left empty or not set, default anti-affinity rules
# (required on hostname, preferred on zone) will be applied.
# Set to {} to disable default anti-affinity (e.g., for single-node clusters).
affinity:

nodeSelector: {}

tolerations: []

podDisruptionBudget:
  enabled: true

networkPolicy:
  enabled: true

# Alternative bootstrap method using a Kubernetes Job.
# Enable this if you prefer Job-based cluster creation over the initContainer approach.
bootstrapJob:
  enabled: false
