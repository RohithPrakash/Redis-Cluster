# Default values for redis-cluster.
# This is a YAML-formatted file.

redisCluster:
  # Total number of nodes in the cluster (must be even and >= 6 for --cluster-replicas 1)
  replicas: 6

image:
  repository: redis-cluster
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Kubernetes cluster domain suffix. The default is "cluster" which produces
# .svc.cluster.local DNS names. Change this if your cluster uses a custom domain.
clusterDomain: cluster

serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999

securityContext:
  runAsUser: 999
  runAsGroup: 999
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

persistence:
  enabled: true
  size: 100Mi
  storageClass: standard

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Affinity rules for pod scheduling. If left empty or not set, default anti-affinity rules
# (required on hostname, preferred on zone) will be applied.
# Set to {} to disable default anti-affinity (e.g., for single-node clusters).
affinity:

nodeSelector: {}

tolerations: []

podDisruptionBudget:
  enabled: true

networkPolicy:
  enabled: true

# TLS configuration for encrypted client connections.
# The AlmaLinux 9 Redis package is compiled with OpenSSL TLS support.
tls:
  enabled: false
  # Encrypt the cluster bus (port 16379) in addition to client connections.
  # This is an advanced setting — your certificates must include SANs that match
  # all pod hostnames, otherwise inter-node handshake will fail.
  clusterBus: false
  # Name of an existing Secret containing the certificate files.
  # If empty and certManager is disabled, TLS will not be mounted.
  existingSecret: ""
  certFilename: tls.crt
  keyFilename: tls.key
  caFilename: ca.crt
  # Client certificate authentication mode.
  # - "no"        : client certificates are not required
  # - "optional"  : client certificates are optional; if presented, they are validated
  # - "yes"       : client certificates are mandatory for all TLS connections
  authClients: "no"
  # Auto-generate certificates using cert-manager.
  certManager:
    enabled: false
    # issuerRef passed to the Certificate resource.
    issuerRef: {}
      # name: "my-issuer"
      # kind: "ClusterIssuer"

# Alternative bootstrap method using a Kubernetes Job.
# Enable this if you prefer Job-based cluster creation over the initContainer approach.
bootstrapJob:
  enabled: false
