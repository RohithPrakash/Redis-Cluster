# SPDX-License-Identifier: Apache-2.0
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "redis-cluster.fullname" . }}
  labels:
    {{- include "redis-cluster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "redis-cluster.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
{{- if .Values.networkPolicy.egress.enabled }}
    - Egress
{{- end }}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "redis-cluster.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 16379
{{- if .Values.networkPolicy.egress.enabled }}
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow intra-cluster communication on Redis ports
    - to:
        - podSelector:
            matchLabels:
              {{- include "redis-cluster.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 16379
{{- end }}
{{- end }}
