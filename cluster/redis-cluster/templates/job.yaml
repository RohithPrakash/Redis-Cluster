{{- if .Values.bootstrapJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "redis-cluster.fullname" . }}-bootstrap
  labels:
    {{- include "redis-cluster.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      labels:
        {{- include "redis-cluster.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "redis-cluster.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              REPLICAS={{ .Values.redisCluster.replicas }}
              SERVICE={{ include "redis-cluster.fullname" . }}
              NAMESPACE={{ .Release.Namespace }}

              for i in $(seq 0 $((REPLICAS - 1))); do
                HOST="${SERVICE}-${i}.${SERVICE}.${NAMESPACE}.svc.cluster.local"
                echo "Waiting for $HOST to respond to PING..."
                until redis-cli -h "$HOST" -p 6379 ping | grep -q PONG; do
                  sleep 2
                done
              done

              if redis-cli -h "${SERVICE}-0.${SERVICE}.${NAMESPACE}.svc.cluster.local" -p 6379 cluster info 2>/dev/null | grep -q "cluster_state:ok"; then
                echo "Cluster already initialized."
                exit 0
              fi

              HOSTS=""
              for i in $(seq 0 $((REPLICAS - 1))); do
                HOSTS="$HOSTS ${SERVICE}-${i}.${SERVICE}.${NAMESPACE}.svc.cluster.local:6379"
              done

              echo "Creating Redis Cluster via Job..."
              redis-cli --cluster create $HOSTS --cluster-replicas 1 --cluster-yes
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
{{- end }}
